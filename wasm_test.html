<!DOCTYPE html>
<html>
<head>
    <title>NoBOMSuite - Wasm Tarayıcı Testi</title>
    <meta charset="utf-8" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #1E1E2E; color: #CDD6F4; padding: 20px; }
        h1, h2 { color: #89B4FA; border-bottom: 1px solid #45475A; padding-bottom: 5px; }
        textarea { width: 95%; background-color: #313244; color: #CDD6F4; border: 1px solid #45475A; border-radius: 5px; padding: 10px; font-family: 'Courier New', Courier, monospace; }
        button { background-color: #89B4FA; color: #1E1E2E; border: none; padding: 8px 12px; margin: 5px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #A6E3A1; }
        #output { background-color: #181825; padding: 10px; border-radius: 5px; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; }
        .success { color: #A6E3A1; }
        .fail { color: #F38BA8; }
    </style>
</head>
<body>
    <h1>NoBOMSuite - WebAssembly (Wasm) Tarayıcı Test Arayüzü</h1>
    <p>Bu arayüz, C# ile yazılmış tarayıcı motorunun doğrudan tarayıcıda test edilmesini sağlar.</p>
    
    <textarea id="codeInput" rows="10">const db_pass = "secret123"; // Şifre testi
function test() {
    // Görünmez karakter testi: ​
    return 'a​b'; // arada U+200B var
}
/* Windows satır sonu testi */
// Tab testi:	burada
// Son satırda newline yok</textarea>

    <div id="controls">
        <button onclick="runTest('ScanBom')">BOM Tara</button>
        <button onclick="runTest('ScanGhostChars')">Hayalet Karakter Tara</button>
        <button onclick="runTest('ScanLineEndings')">Windows Satır Sonu Tara (CRLF)</button>
        <button onclick="runTest('ScanNewline')">Eksik Son Satır (POSIX) Tara</button>
        <button onclick="runTest('ScanTabs')">Sekme (Tab) Tara</button>
        <button onclick="runTest('ScanHardcodedPasswords')">Hardcoded Şifre Tara</button>
    </div>

    <h2>Sonuçlar:</h2>
    <pre id="output">Wasm motoru yükleniyor, lütfen bekleyin...</pre>

    <!-- .NET Wasm Runtime'ı ve Uygulama DLL'ini yükler -->
    <script type="module">
        import { dotnet } from './_framework/dotnet.js'

        const outputElement = document.getElementById('output');
        try {
            const { getAssemblyExports, getConfig } = await dotnet
                .withDiagnosticTracing(false)
                .create();

            const config = getConfig();
            const exports = await getAssemblyExports(config.mainAssemblyName);
            const bridge = exports.SanitizerKit.Wasm.WasmBridge;

            outputElement.textContent = '✅ Wasm motoru başarıyla yüklendi. Teste hazır.';
            outputElement.className = 'success';

            // Butonlara tıklandığında testleri çalıştıracak global fonksiyon
            window.runTest = async function(testName) {
                const code = document.getElementById('codeInput').value;
                
                // JavaScript string'ini C#'ın anlayacağı byte dizisine (UTF-8) çevir
                const bytes = new TextEncoder().encode(code);

                // Wasm üzerinden C# fonksiyonunu çağır
                const hasIssue = bridge[testName](bytes);

                outputElement.textContent = `Sonuç [${testName}]: ${hasIssue ? '🔴 SORUN TESPİT EDİLDİ' : '🟢 TEMİZ'}`;
                outputElement.className = hasIssue ? 'fail' : 'success';
            }
        } catch (e) {
            outputElement.textContent = `❌ HATA: Wasm motoru yüklenemedi. Projenin Wasm olarak derlendiğinden emin olun.\nDetay: ${e.message}`;
            outputElement.className = 'fail';
        }
    </script>
</body>
</html>
